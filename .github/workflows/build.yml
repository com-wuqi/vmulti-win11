name: Build vmulti-win11 Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Windows SDK and WDK
      run: |
        Write-Host "Installing Windows SDK and WDK..."
        winget install Microsoft.WindowsSDK.10.0.28000 --accept-source-agreements --accept-package-agreements
        winget install Microsoft.WindowsWDK.10.0.28000 --accept-source-agreements --accept-package-agreements
      shell: pwsh

    - name: Install x86 VC++ Redistributable (Fixes InfVerif.dll error)
      run: |
        Write-Host "Installing x86 VC++ Redist to fix InfVerif.dll loading issue..."
        winget install Microsoft.VCRedist.2015+.x86 --accept-source-agreements --accept-package-agreements
        
        # 容错处理：如果 winget 返回 1 且提示已安装，则视为成功，不中断 CI
        if ($LASTEXITCODE -ne 0) {
            Write-Host "Warning: winget exited with code $LASTEXITCODE. This is expected if the package is already installed and up to date. Continuing..."
        }
      shell: pwsh

    - name: Patch source code and project files (Robust XML method)
      run: |
        Write-Host "=== 1. Patching vmulti.h ==="
        $hPath = "driver\kmdf\vmulti.h"
        $hContent = Get-Content $hPath -Raw
        # 替换硬编码的绝对路径为标准 C 包含
        $hContent = $hContent -replace '#include "C:\\Program Files \(x86\)\\Windows Kits\\10\\Include\\10\.0\.26100\.0\\km\\wdm\.h"', '#include <wdm.h>'
        $hContent = $hContent -replace '#include "C:\\Program Files \(x86\)\\Windows Kits\\10\\Include\\wdf\\kmdf\\1\.15\\wdf\.h"', '#include <wdf.h>'
        Set-Content -Path $hPath -Value $hContent -NoNewline
        Write-Host "vmulti.h patched successfully."

        Write-Host "=== 2. Patching vmulti.vcxproj using XML ==="
        $projPath = "driver\kmdf\vmulti.vcxproj"
        $xml = [xml](Get-Content $projPath -Raw)
        
        # 强制在项目最顶部禁用 InfVerif (最高优先级)
        $newPg = $xml.CreateElement('PropertyGroup')
        $runInfVerif = $xml.CreateElement('RunInfVerif')
        $runInfVerif.InnerText = 'false'
        $newPg.AppendChild($runInfVerif) | Out-Null
        $xml.Project.PrependChild($newPg) | Out-Null

        # 修复所有包含 IncludePath 的 PropertyGroup
        $propertyGroups = $xml.Project.PropertyGroup | Where-Object { $_.IncludePath }
        foreach ($pg in $propertyGroups) {
            $path = $pg.IncludePath
            # 1. 替换为 WDK 标准内核宏
            $path = $path -replace 'C:\\Program Files \(x86\)\\Windows Kits\\10\\Include\\10\.0\.26100\.0\\km', '$(KM_IncludePath)'
            # 2. 移除硬编码的 shared 路径 (已包含在 WindowsSDK_IncludePath 中)
            $path = $path -replace 'C:\\Program Files \(x86\)\\Windows Kits\\10\\Include\\10\.0\.26100\.0\\shared', ''
            # 3. 移除硬编码的 WDF 路径 (WDK 的 KMDF 项目类型会自动注入正确的 WDF 路径)
            $path = $path -replace 'C:\\Program Files \(x86\)\\Windows Kits\\10\\Include\\wdf\\kmdf\\1\.15', ''
            
            # 清理替换后可能产生的多余分号
            $path = $path -replace ';;+', ';'
            $path = $path -replace '^;|;$', '' 
            $pg.IncludePath = $path
        }
        
        $xml.Save($projPath)
        Write-Host "vmulti.vcxproj patched successfully."
        
        # 调试输出：验证修改后的 IncludePath
        Write-Host "Modified IncludePath entries:"
        Get-Content $projPath | Select-String "IncludePath"
      shell: pwsh

    - name: Build x64 Client, Driver, and Test App
      run: |
        Write-Host "=== Building client library ==="
        msbuild client\vmulticlient.vcxproj /p:Configuration=Release /p:Platform=x64 /m
        
        Write-Host "=== Building x64 driver ==="
        # 双重保险：命令行再次传递 RunInfVerif=false
        msbuild driver\kmdf\vmulti.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TestSign=false /p:RunInfVerif=false /m
        
        Write-Host "=== Building x64 test application ==="
        msbuild test\testvmulti.vcxproj /p:Configuration=Release /p:Platform=x64 /p:RuntimeLibrary=MultiThreadedDLL /m
      shell: pwsh

    - name: Package Build Artifacts
      run: |
        Write-Host "Packaging artifacts..."
        New-Item -ItemType Directory -Force -Path driver_dist\x64
        New-Item -ItemType Directory -Force -Path driver_dist\inc
        New-Item -ItemType Directory -Force -Path driver_dist\cert
        
        Copy-Item -Path "driver\kmdf\x64\Release\vmulti\*.*" -Destination "driver_dist\x64\" -Force -ErrorAction SilentlyContinue
        Copy-Item -Path "client\x64\Release\vmulticlient.lib" -Destination "driver_dist\x64\" -Force -ErrorAction SilentlyContinue
        Copy-Item -Path "test\x64\Release\testvmulti.exe" -Destination "driver_dist\x64\" -Force -ErrorAction SilentlyContinue
        Copy-Item -Path "inc\*.h" -Destination "driver_dist\inc\" -Force -ErrorAction SilentlyContinue
        
        if (Test-Path "driver\kmdf\x64\Release\vmulti.cer") {
            Copy-Item -Path "driver\kmdf\x64\Release\vmulti.cer" -Destination "driver_dist\cert\WDKTestCert.cer" -Force
        }
      shell: pwsh

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vmulti-win11-x64-build
        path: driver_dist/
        retention-days: 7
