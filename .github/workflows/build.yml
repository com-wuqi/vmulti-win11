name: Build vmulti-win11 Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 允许在 GitHub 网页端手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Windows Driver Kit (WDK)
      run: |
        # 静默安装 Windows 11 SDK 和 WDK
        winget install Microsoft.WindowsSDK.10.0.26100 --accept-source-agreements --accept-package-agreements
        winget install Microsoft.WindowsWDK.10.0.26100 --accept-source-agreements --accept-package-agreements
      shell: pwsh

    - name: Build x64 Driver and Client
      run: |
        # 直接调用 msbuild 绕过 build.bat 中的本地管理员权限检查 (net session)，使 CI 更稳定
        echo Building client library...
        msbuild client\vmulticlient.vcxproj /p:Configuration=Release /p:Platform=x64 /m
        
        echo Building x64 driver...
        msbuild driver\kmdf\vmulti.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TestSign=false /m
        
        echo Building x64 test application...
        msbuild test\testvmulti.vcxproj /p:Configuration=Release /p:Platform=x64 /m
      shell: cmd

    - name: Package Build Artifacts
      run: |
        New-Item -ItemType Directory -Path 'driver_dist/x64' -Force | Out-Null
        New-Item -ItemType Directory -Path 'driver_dist/inc' -Force | Out-Null
        New-Item -ItemType Directory -Path 'driver_dist/cert' -Force | Out-Null

        $driverCandidates = @(
          'driver/kmdf/x64/Release/vmulti',
          'x64/Release/vmulti',
          'driver/kmdf/x64/Release'
        )

        $driverPackageDir = $driverCandidates | Where-Object { Test-Path (Join-Path $_ 'vmulti.inf') } | Select-Object -First 1
        if (-not $driverPackageDir) {
          $driverInf = Get-ChildItem -Path . -Filter 'vmulti.inf' -Recurse -File | Select-Object -First 1
          if ($driverInf) {
            $driverPackageDir = $driverInf.DirectoryName
          }
        }

        if (-not $driverPackageDir) {
          throw 'Could not find built driver package directory containing vmulti.inf.'
        }

        Write-Host "Using driver package directory: $driverPackageDir"
        Copy-Item -Path (Join-Path $driverPackageDir '*') -Destination 'driver_dist/x64' -Recurse -Force
        Copy-Item -Path 'client/x64/Release/vmulticlient.lib' -Destination 'driver_dist/x64' -Force
        Copy-Item -Path 'test/x64/Release/testvmulti.exe' -Destination 'driver_dist/x64' -Force
        Copy-Item -Path 'inc/*.h' -Destination 'driver_dist/inc' -Force

        $certSource = 'driver/kmdf/x64/Release/vmulti.cer'
        if (Test-Path $certSource) {
          Copy-Item -Path $certSource -Destination 'driver_dist/cert/WDKTestCert.cer' -Force
        } else {
          Write-Host 'Warning: vmulti.cer not found, skipping certificate packaging.'
        }
      shell: pwsh

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vmulti-win11-x64-build
        path: driver_dist
        retention-days: 7
