name: Build vmulti-win11 Driver

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 允许在 GitHub 网页端手动触发

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Windows Driver Kit (WDK)
      run: |
        # 静默安装 Windows 11 SDK 和 WDK
        winget install Microsoft.WindowsSDK.10.0.26100 --accept-source-agreements --accept-package-agreements
        winget install Microsoft.WindowsWDK.10.0.26100 --accept-source-agreements --accept-package-agreements
      shell: pwsh

    - name: Build x64 Driver and Client
      run: |
        # 直接调用 msbuild 绕过 build.bat 中的本地管理员权限检查 (net session)，使 CI 更稳定
        echo Building client library...
        msbuild client\vmulticlient.vcxproj /p:Configuration=Release /p:Platform=x64 /m
        
        echo Building x64 driver...
        msbuild driver\kmdf\vmulti.vcxproj /p:Configuration=Release /p:Platform=x64 /p:TestSign=false /m
        
        echo Building x64 test application...
        msbuild test\testvmulti.vcxproj /p:Configuration=Release /p:Platform=x64 /m
      shell: cmd

    - name: Package Build Artifacts
      run: |
        if not exist driver_dist\x64 mkdir driver_dist\x64
        if not exist driver_dist\inc mkdir driver_dist\inc
        if not exist driver_dist\cert mkdir driver_dist\cert
        xcopy /Y /I driver\kmdf\x64\Release\vmulti\*.* driver_dist\x64\
        copy client\x64\Release\vmulticlient.lib driver_dist\x64\
        copy test\x64\Release\testvmulti.exe driver_dist\x64\
        copy inc\*.h driver_dist\inc\ /Y
        if exist driver\kmdf\x64\Release\vmulti.cer (
          copy driver\kmdf\x64\Release\vmulti.cer driver_dist\cert\WDKTestCert.cer /Y
        ) else (
          echo Warning: vmulti.cer not found, skipping certificate packaging.
        )
      shell: cmd

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: vmulti-win11-x64-build
        path: driver_dist
        retention-days: 7
